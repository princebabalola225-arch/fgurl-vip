<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Official Receipt | FodaKem VIP</title>
    <link rel="stylesheet" href="VLAND.css">
    <style>
        .receipt { max-width: 600px; margin: 0 auto; }
        .receipt table { width: 100%; border-collapse: collapse; }
        .receipt td { padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 15px; }
        .receipt .brand { color: #553c9a; }
        .receipt .total-row td { font-size: 18px; font-weight: bold; color: #2d3748; }
        @media print {
            .no-print { display: none !important; }
            body { background: white; }
        }
    </style>
</head>
<body>
    <div class="container" style="padding: 30px 15px;">
        <div class="receipt job-card" style="padding: 30px;">
            <div style="text-align:center; border-bottom: 2px dashed #cbd5e0; padding-bottom: 15px; margin-bottom: 15px;">
                <h1 class="brand" style="margin:0;">FodaKem VIP</h1>
                <p style="color:#718096; margin:5px 0;">Official Order Receipt</p>
            </div>
            <div id="receiptBody"><p style="color:#999;">Loading receipt...</p></div>
            <div class="no-print" style="text-align:center; margin-top:25px;">
                <button class="btn" style="background:#553c9a; color:white;" onclick="window.print()">🖨 Print Receipt</button>
                <a href="dashboard.html" class="btn" style="background:#edf2f7; color:#4a5568; text-decoration:none; display:inline-block; margin-left:8px;">�? Back to Dashboard</a>
            </div>
        </div>
    </div>

    <script>
        const BACKEND_URL = window.location.origin;
        const txnId = new URLSearchParams(window.location.search).get('id');
        const user = localStorage.getItem('active_user');

        if (!txnId) {
            document.getElementById('receiptBody').innerHTML = '<p style="color:#c53030;">No receipt id provided.</p>';
        } else {
            fetch(`${BACKEND_URL}/api/transaction/${txnId}`)
                .then(r => { if (!r.ok) throw new Error('not found'); return r.json(); })
                .then(t => {
                    const statusColor = String(t.production_status || '').includes('Completed') ? 'green'
                        : String(t.production_status || '').includes('Cancelled') ? '#c53030' : '#2b6cb0';
                    document.getElementById('receiptBody').innerHTML = `
                        <table>
                            <tr><td><strong>Receipt No</strong></td><td>#${String(t.id).padStart(4, '0')}</td></tr>
                            <tr><td><strong>Customer</strong></td><td>${t.username}</td></tr>
                            <tr><td><strong>Order</strong></td><td>${t.job_type}</td></tr>
                            <tr><td><strong>Base Price</strong></td><td>₦${Number(t.actual_price).toLocaleString()}</td></tr>
                            <tr><td><strong>VIP Charge</strong></td><td>₦${Number(t.vip_money).toLocaleString()}</td></tr>
                            <tr class="total-row"><td><strong>Total</strong></td><td>₦${Number(t.total_price).toLocaleString()}</td></tr>
                            <tr><td><strong>Payment</strong></td><td>${t.status}</td></tr>
                            <tr><td><strong>Order Status</strong></td><td style="color:${statusColor}; font-weight:bold;">${t.production_status || 'Awaiting Production'}</td></tr>
                            <tr><td><strong>Date</strong></td><td>${t.timestamp}</td></tr>
                        </table>`;
                })
                .catch(() => {
                    document.getElementById('receiptBody').innerHTML = '<p style="color:#c53030;">Receipt not found.</p>';
                });
        }
    </script>
</body>
</html>
